[package]
name = "rust_zk_prover"
version = "0.1.0"
edition = "2021"
authors = ["CipherTrial Midnight Team <shritesh@example.com>"]
description = "Native Rust Zero-Knowledge Proving Engine for Midnight Compact Circuits"

[dependencies]
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "rust_zk_prover_cli"
path = "src/main.rs"
